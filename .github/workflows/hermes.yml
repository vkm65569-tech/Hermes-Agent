name: Hermes Agent 24/7

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

concurrency:
  group: hermes-agent
  cancel-in-progress: false

permissions:
  actions: write
  contents: write

env:
  HERMES_STATE_DIR: hermes-state

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Guard - skip if another run is active
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
        run: |
          active=$(gh run list --workflow "${{ github.workflow }}" --repo "${{ github.repository }}" \
            --limit 10 --json databaseId,status \
            --jq '[.[] | select(.databaseId != '"${{ github.run_id }}"' and (.status == "in_progress" or .status == "queued" or .status == "pending" or .status == "waiting"))] | length')
          if [ "${active:-0}" -gt 0 ]; then
            echo "Another run is active - this run will do nothing"
            touch .guard-skip
          else
            echo "No active sibling runs - proceeding"
          fi

      - name: Checkout
        uses: actions/checkout@v4

      # ── R2 PERSISTENT STORAGE ─────────────────────────────────────────
      - name: Mount R2 persistent storage
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          [ ! -f .guard-skip ] || exit 0
          bash scripts/mount-r2.sh

      # ── RESTORE STATE (R2 first, then releases as fallback) ───────────
      - name: Restore Hermes state
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
          STATE_ENCRYPTION_KEY: ${{ secrets.STATE_ENCRYPTION_KEY }}
        run: |
          [ ! -f .guard-skip ] || exit 0

          # If R2 already restored data, skip release restore
          if [ -f "$HOME/.hermes/.r2-restored" ]; then
            echo "State already restored from R2 — skipping release restore"
            rm -f "$HOME/.hermes/.r2-restored"
            exit 0
          fi

          # R2 was empty or not mounted — try restoring from releases
          echo "R2 has no data — attempting restore from encrypted releases..."
          mkdir -p "$HOME/.hermes" "$HOME/workspace" /tmp/restore
          restored=0
          tags=$(gh release list --repo "${{ github.repository }}" --limit 5 --json tagName --jq '.[].tagName' 2>/dev/null || true)
          for tag in $tags; do
            rm -rf /tmp/restore/*
            ok=0
            if gh release download "$tag" --repo "${{ github.repository }}" --pattern '*.tar.gz.enc' --clobber --dir /tmp/restore >/dev/null 2>&1; then
              enc=$(ls /tmp/restore/*.tar.gz.enc 2>/dev/null | head -1 || true)
              if [ -n "$enc" ] && openssl enc -d -aes-256-cbc -pbkdf2 -iter 100000 -pass env:STATE_ENCRYPTION_KEY -in "$enc" -out /tmp/restore/state.tar.gz 2>/dev/null; then
                ok=1
              else
                echo "  $tag: decrypt failed, trying next"
              fi
            fi
            if [ "$ok" != "1" ]; then
              rm -rf /tmp/restore/*
              if gh release download "$tag" --repo "${{ github.repository }}" --pattern '*.tar.gz' --clobber --dir /tmp/restore >/dev/null 2>&1; then
                arc=$(ls /tmp/restore/*.tar.gz 2>/dev/null | head -1 || true)
                if [ -n "$arc" ]; then
                  mv "$arc" /tmp/restore/state.tar.gz
                  ok=1
                fi
              fi
            fi
            if [ "$ok" = "1" ]; then
              if tar -xzf /tmp/restore/state.tar.gz -C . 2>/dev/null; then
                # Restore hermes data
                if [ -d "$HERMES_STATE_DIR/hermes" ]; then
                  rsync -a "$HERMES_STATE_DIR/hermes/" "$HOME/.hermes/"
                elif [ -d "$HERMES_STATE_DIR" ]; then
                  rsync -a --exclude 'hermes-agent' "$HERMES_STATE_DIR/" "$HOME/.hermes/"
                fi
                # Restore workspace if present in backup
                if [ -d "$HERMES_STATE_DIR/workspace" ]; then
                  rsync -a "$HERMES_STATE_DIR/workspace/" "$HOME/workspace/"
                  echo "Workspace restored from release"
                fi
                echo "State restored from release $tag ($(du -sh "$HOME/.hermes" | cut -f1))"
                restored=1

                # MIGRATION: Push restored data to R2 for future runs
                if mountpoint -q /mnt/r2 2>/dev/null; then
                  echo "Migrating restored data to R2..."
                  rsync -a "$HOME/.hermes/" /mnt/r2/hermes/ \
                    --exclude 'hermes-agent' --exclude 'hermes-agent/' \
                    --exclude 'bin' --exclude 'bin/' \
                    --exclude 'venvs' --exclude 'venvs/' \
                    --exclude 'auth' --exclude 'auth/' \
                    --exclude 'auth.json' --exclude 'auth.lock' \
                    --exclude 'logs' --exclude 'logs/' \
                    --exclude 'whatsapp' --exclude 'whatsapp/' \
                    --exclude '*.pyc' --exclude '__pycache__' --exclude '__pycache__/' \
                    --exclude 'node_modules' --exclude '.venv' --exclude 'venv' \
                    --exclude '.next' --exclude 'dist' --exclude 'build' \
                    --exclude '.cache' --exclude '.git' --exclude 'target' \
                    --exclude '.cargo/registry' --exclude 'coverage' --exclude '.nyc_output' \
                    2>/dev/null || true
                  if [ -d "$HOME/workspace" ] && [ "$(ls -A "$HOME/workspace" 2>/dev/null)" ]; then
                    rsync -a "$HOME/workspace/" /mnt/r2/workspace/ 2>/dev/null || true
                  fi
                  echo "Migration to R2 complete — future runs will restore from R2 directly"
                fi

                break
              fi
            fi
          done
          [ "$restored" = "1" ] || echo "No usable release found - first run"
          rm -rf /tmp/restore "$HERMES_STATE_DIR" 2>/dev/null || true

      - name: Install Hermes
        run: |
          [ ! -f .guard-skip ] || exit 0
          curl -fsSL https://hermes-agent.nousresearch.com/install.sh | bash
          {
            echo "PATH=$HOME/.hermes/bin:$HOME/.local/bin:$PATH"
          } >> "$GITHUB_ENV"

      - name: Verify install
        run: |
          [ ! -f .guard-skip ] || exit 0
          export PATH="$HOME/.hermes/bin:$HOME/.local/bin:$PATH"
          command -v hermes || { echo "hermes not on PATH after install"; exit 1; }
          hermes --version

      - name: Write credentials
        env:
          OPENCODE_ZEN_API_KEY: ${{ secrets.OPENCODE_ZEN_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NOUS_API_KEY: ${{ secrets.NOUS_API_KEY }}
          FIREWORKS_API_KEY: ${{ secrets.FIREWORKS_API_KEY }}
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          DEEPINFRA_API_KEY: ${{ secrets.DEEPINFRA_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          PARALLEL_API_KEY: ${{ secrets.PARALLEL_API_KEY }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          FAL_KEY: ${{ secrets.FAL_KEY }}
          HONCHO_API_KEY: ${{ secrets.HONCHO_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALLOWED_USERS: ${{ secrets.TELEGRAM_ALLOWED_USERS }}
          TELEGRAM_HOME_CHANNEL: ${{ secrets.TELEGRAM_HOME_CHANNEL }}
          TELEGRAM_CRON_THREAD_ID: ${{ secrets.TELEGRAM_CRON_THREAD_ID }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_APP_TOKEN: ${{ secrets.SLACK_APP_TOKEN }}
          SLACK_ALLOWED_USERS: ${{ secrets.SLACK_ALLOWED_USERS }}
        run: |
          [ ! -f .guard-skip ] || exit 0
          mkdir -p "$HOME/.hermes"
          env_file="$HOME/.hermes/.env"

          # MERGE strategy: preserve runtime-added keys (e.g., added via Telegram)
          # while GitHub Secrets always take priority for matching keys.
          # 1. Load existing .env (from R2 restore) into temp
          # 2. Overwrite/add GitHub Secrets
          # 3. Result: runtime keys preserved + secrets updated
          touch "$env_file"
          cp "$env_file" /tmp/.env.existing 2>/dev/null || touch /tmp/.env.existing

          for var in \
            OPENCODE_ZEN_API_KEY OPENROUTER_API_KEY ANTHROPIC_API_KEY GOOGLE_API_KEY GEMINI_API_KEY \
            NOUS_API_KEY FIREWORKS_API_KEY KIMI_API_KEY HF_TOKEN DEEPINFRA_API_KEY \
            EXA_API_KEY PARALLEL_API_KEY FIRECRAWL_API_KEY FAL_KEY HONCHO_API_KEY \
            TELEGRAM_BOT_TOKEN TELEGRAM_ALLOWED_USERS TELEGRAM_HOME_CHANNEL \
            TELEGRAM_CRON_THREAD_ID SLACK_BOT_TOKEN SLACK_APP_TOKEN SLACK_ALLOWED_USERS; do
            val="${!var}"
            if [ -n "$val" ]; then
              # Remove existing line for this key (if any) and add the secret value
              sed -i "/^${var}=/d" /tmp/.env.existing
              printf '%s=%s\n' "$var" "$val" >> /tmp/.env.existing
            fi
          done

          # Write merged result
          mv /tmp/.env.existing "$env_file"
          chmod 600 "$env_file"
          existing_count=$(wc -l < "$env_file")
          echo ".env merged — ${existing_count} total keys (GitHub Secrets override, runtime keys preserved)"

      - name: Apply config overrides
        run: |
          [ ! -f .guard-skip ] || exit 0
          if [ -n "$HERMES_PROVIDER" ]; then
            hermes config set model.provider "$HERMES_PROVIDER"
            echo "provider -> $HERMES_PROVIDER"
            case "$HERMES_PROVIDER" in
              opencode-zen) base_url="https://opencode.ai/zen/v1" ;;
              openrouter)   base_url="https://openrouter.ai/api/v1" ;;
              gemini)       base_url="https://generativelanguage.googleapis.com/v1beta/openai" ;;
              *)            base_url="" ;;
            esac
            if [ -n "$base_url" ]; then
              hermes config set model.base_url "$base_url"
              echo "base_url -> $base_url"
            fi
          fi
          if [ -n "$HERMES_MODEL" ]; then
            hermes config set model.default "$HERMES_MODEL"
            echo "model -> $HERMES_MODEL"
          fi
          for task in title_generation vision web_extract compression; do
            hermes config set "auxiliary.$task.provider" main || true
          done
          hermes config set auxiliary.title_generation.enabled false || true
          echo "auxiliary tasks pinned to main provider"
        env:
          HERMES_PROVIDER: ${{ vars.HERMES_PROVIDER }}
          HERMES_MODEL: ${{ vars.HERMES_MODEL }}

      - name: Diagnostics
        run: |
          [ ! -f .guard-skip ] || exit 0
          hermes doctor --fix || true
          hermes doctor || true
          hermes status --all | head -60 || true

      # ── NOTIFY RESTART ────────────────────────────────────────────────
      - name: Notify restart via Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_HOME_CHANNEL: ${{ secrets.TELEGRAM_HOME_CHANNEL }}
          TELEGRAM_ALLOWED_USERS: ${{ secrets.TELEGRAM_ALLOWED_USERS }}
        run: |
          [ ! -f .guard-skip ] || exit 0
          # Determine how state was restored
          if mountpoint -q /mnt/r2 2>/dev/null && [ -d /mnt/r2/hermes ]; then
            restore_source="r2"
          else
            restore_source="release"
          fi
          bash scripts/notify-restart.sh "$restore_source" || true

      - name: Bootstrap autonomous work
        run: |
          [ ! -f .guard-skip ] || exit 0
          mkdir -p "$HOME/workspace"
          hermes -z "You are running 24/7 from a GitHub Actions runner. Your data is now persisted on Cloudflare R2 — runner restarts cause ZERO data loss. Inspect your environment, memory, skills, and cron jobs. If no scheduled cron jobs exist, create 2-3 useful ones (e.g. a morning briefing and a weekly audit) delivered to your home channel, and run a quick memory check. Your workspace directory is at ~/workspace/ — any code you write there is persisted. IMPORTANT: do NOT install, start, stop, restart, or manage the gateway service or any systemd units - the workflow launches the gateway immediately after you finish. Do not modify gateway_state.json. Reply with a short summary of what you set up." || true

      # ── RUN GATEWAY WITH R2 SYNC ──────────────────────────────────────
      - name: Run gateway
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
          STATE_ENCRYPTION_KEY: ${{ secrets.STATE_ENCRYPTION_KEY }}
        run: |
          [ ! -f .guard-skip ] || exit 0

          # Trap: on SIGTERM/SIGINT, flush data to R2 and do emergency release save
          trap '{
            echo "Signal received — flushing data to R2..."
            bash scripts/unmount-r2.sh || true
            bash scripts/release-state.sh "hermes: emergency save on signal" || true
          }' INT TERM

          # Start background R2 sync daemon (every 30 seconds)
          if mountpoint -q /mnt/r2 2>/dev/null; then
            bash scripts/sync-to-r2.sh &
            SYNC_PID=$!
            echo "R2 sync daemon started (PID: $SYNC_PID)"
          else
            echo "R2 not mounted — falling back to heartbeat release saves"
            SYNC_PID=""
            # Fallback: old-style heartbeat saves to releases
            (
              while [ ! -f "$HOME/.hermes/stop-heartbeat" ]; do
                sleep 600
                bash scripts/release-state.sh "hermes: heartbeat $(date -u +%Y-%m-%dT%H:%M:%SZ)" || true
              done
            ) &
            SYNC_PID=$!
          fi

          # Run the gateway
          timeout --signal=TERM --kill-after=60 19500 hermes gateway run --replace || code=$?
          echo "Gateway exited with code ${code:-0}"

          # Stop the sync/heartbeat daemon
          touch "$HOME/.hermes/stop-r2-sync" 2>/dev/null || true
          touch "$HOME/.hermes/stop-heartbeat" 2>/dev/null || true
          if [ -n "${SYNC_PID:-}" ]; then
            kill "$SYNC_PID" 2>/dev/null || true
            wait "$SYNC_PID" 2>/dev/null || true
          fi
          exit 0

      # ── CLEANUP: FLUSH + UNMOUNT + BACKUP + CHAIN ─────────────────────
      - name: Final sync and unmount R2
        if: always()
        run: |
          [ ! -f .guard-skip ] || exit 0
          bash scripts/unmount-r2.sh || true

      - name: Save state to encrypted release (backup)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
          STATE_ENCRYPTION_KEY: ${{ secrets.STATE_ENCRYPTION_KEY }}
        run: |
          [ ! -f .guard-skip ] || exit 0
          bash scripts/release-state.sh "hermes: final backup $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "State backup size: $(du -sh "$HERMES_STATE_DIR" 2>/dev/null | cut -f1 || echo '?')"

      - name: Cleanup old releases
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
        run: |
          [ ! -f .guard-skip ] || exit 0
          bash scripts/cleanup-releases.sh 3 || true

      - name: Chain next run
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
        run: |
          [ ! -f .guard-skip ] || exit 0
          pending=$(gh run list --workflow "${{ github.workflow }}" --repo "${{ github.repository }}" \
            --limit 5 --json databaseId,status \
            --jq '[.[] | select(.databaseId != '"${{ github.run_id }}"' and (.status == "in_progress" or .status == "queued"))] | length')
          if [ "${pending:-0}" -gt 0 ]; then
            echo "Another run is already queued/running - skipping chain"
            exit 0
          fi
          for attempt in 1 2 3 4 5; do
            if gh workflow run "${{ github.workflow }}" --repo "${{ github.repository }}"; then
              echo "Chained next run (attempt $attempt)"
              exit 0
            fi
            sleep 15
          done
          echo "Chain failed after 5 attempts - the 6-hour cron schedule will pick it up"
